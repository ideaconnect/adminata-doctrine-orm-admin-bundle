# Services the test suite needs. Start them with `make services-up`.
#
# adminata supports MySQL, MariaDB and Percona; there is no SQLite support and the test databases
# are MySQL too. Override DATABASE_URL and ADMINATA_TEST_DATABASE_URL to run the suite against your
# own server instead of this one.
#
# The port is adminata's 7010, so a checkout of both repositories side by side shares one server:
# start it in either and the other finds it. The databases are named apart.
services:
    database:
        image: mysql:8.4
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: adminata
            MYSQL_DATABASE: adminata_orm_test
        ports:
            - '7010:3306'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-padminata']
            interval: 5s
            timeout: 5s
            retries: 20
        tmpfs:
            - /var/lib/mysql

    # The browser the Panther tests drive. Start it and export
    # PANTHER_SELENIUM_HOST=http://127.0.0.1:4444 to run them against it instead of a geckodriver
    # on this machine. `host.docker.internal` is how the browser reaches the test application,
    # which Panther serves from the host.
    selenium:
        image: selenium/standalone-firefox:latest
        shm_size: 2gb
        ports:
            - '4444:4444'
            - '7900:7900'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
